# TabbyAPI config for exl3-serve — validated for Qwen3.6-27B @ 256K on a single 24 GB GPU.
# Copy to tabbyAPI/config.yml (scripts/serve.sh does this automatically).

network:
  host: 127.0.0.1
  port: 5000
  disable_auth: true          # local use; set false + configure api_tokens.yml for exposed deployments
  api_servers: ["OAI"]

logging:
  log_prompt: false
  log_generation_params: false

model:
  # Absolute path to the folder containing your EXL3 model dirs (each dir = one model_name).
  model_dir: /path/to/exl3-serve/models
  # Name of the model subdir produced by scripts/download-model.sh (edit to match).
  model_name: Qwen3.6-27B-exl3-4.0bpw
  max_seq_len: 262144         # 256K — Qwen3.6 native max
  cache_size: 262144
  cache_mode: Q4              # 4-bit KV — only mode that fits full 256K on 24 GB (~21.4 GB); Q6/Q8@256K OOM.
  chunk_size: 2048
  gpu_split_auto: true

draft_model:
  draft_mode: mtp             # multi-token-prediction speculative decoding (~2x decode)
  draft_cache_mode: Q8        # requires a compatible bf16 MTP head in the model dir (see download script)

developer:
  unsafe_launch: false
