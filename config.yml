# TabbyAPI config for exl3-serve — validated for Qwen3.6-27B @ 128K on a single 24 GB GPU.
# Context trimmed 180K -> 128K (2026-07-31) to free VRAM for marker/surya-2 OCR GPU offload.
# Copy to tabbyAPI/config.yml (scripts/serve.sh does this automatically).

network:
  host: 127.0.0.1
  port: 5000
  disable_auth: true          # local use; set false + configure api_tokens.yml for exposed deployments
  api_servers: ["OAI"]

logging:
  log_prompt: true                     # log final rendered prompt (post chat-template, incl. tools) + model response to console/journal
  log_generation_params: true          # log sampling params per request
  log_requests: true                   # log raw incoming requests (debug)
  log_chat_completion_requests: false  # request-only dumps — superseded by log_turns (one combined file per turn)
  log_turns: true                      # one file per agentic turn: request (messages+tools) + rendered prompt + response → logs/turns/*.json

model:
  # Absolute path to the folder containing your EXL3 model dirs (each dir = one model_name).
  # Substituted by scripts/render-config.sh (default: <repo>/models, matching
  # scripts/download-model.sh). Override with EXL3_MODEL_DIR=/mnt/models.
  # TabbyAPI does not expand ~ or $VARS here, so it must land as a literal path.
  model_dir: @MODEL_DIR@
  # Name of the model subdir produced by scripts/download-model.sh (edit to match).
  model_name: Qwen3.6-27B-exl3-4.0bpw
  max_seq_len: 131072         # 128K — trimmed from 180K to free ~2 GB VRAM for surya-2 OCR GPU offload (2026-07-31)
  cache_size: 131072
  cache_mode: Q6              # 6-bit KV — near-lossless; no min_p workaround needed
  chunk_size: 2048            # benchmarked 4096: no prefill gain on this model; 2048 keeps max VRAM headroom
  gpu_split_auto: true
  tool_format: qwen3_coder     # parse the model's XML into structured tool_calls; blank = tool calls returned as plain text
  reasoning: true              # parse <think> tags into reasoning_content instead of leaking into content
  reasoning_start_token: "<think>"
  reasoning_end_token: "</think>"
  vision: true

# MTP speculative decoding (exllamav3 >= 1.2.0 dynamic draft window).
# The dynamic draft window shrinks the draft cache to fit within remaining VRAM, but
# Q8 draft cache at 256K still OOMs on 24 GB (2026-07-29 test). Q4 + draft_num_tokens=1 fits.
draft_model:
  draft_mode: mtp             # multi-token-prediction speculative decoding (~2x decode)
  draft_cache_mode: Q4        # Q4 is the max that fits alongside Q6 main cache @ ~180K
  draft_num_tokens: 3         # kept at 3 for VRAM headroom with vision + Q6 cache @ 200K

sampling:
  # min_p=0.05 override not needed with Q6 KV cache.
  # Re-enable if switching back to Q4:  override_preset: exl3_quant_floor
  # override_preset: exl3_quant_floor

developer:
  unsafe_launch: false
